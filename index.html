
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vice City v1.1</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#10152c;color:white;font-family:Arial}
canvas{display:block}
#hud{
 position:fixed;top:12px;left:12px;
 padding:13px;background:#10152ddd;
 border:1px solid #00eaff;border-radius:10px;
 font-size:13px;line-height:1.8;
 pointer-events:none
}
#message{
 position:fixed;bottom:25px;left:50%;
 transform:translateX(-50%);
 background:#10152ddd;border:1px solid #ff35c5;
 padding:12px 20px;border-radius:10px;
 text-align:center;white-space:nowrap
}
#start{
 position:fixed;inset:0;z-index:10;
 background:#090b20;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;gap:18px;
}
#start h1{
 font-size:42px;color:#ff35c5;
 text-shadow:0 0 20px #ff00bb
}
button{
 padding:15px 35px;border:0;border-radius:8px;
 background:#00dfff;font-weight:bold;font-size:17px
}
#crosshair{
 position:fixed;top:50%;left:50%;
 transform:translate(-50%,-50%);
 pointer-events:none
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
 }
}
</script>
</head>

<body>

<div id="start">
 <h1>VICE CITY</h1>
 <p>Відкритий 3D-світ — версія 1.1</p>
 <button id="play">ПОЧАТИ ГРУ</button>
 <p>WASD — рух | Подвійне W — біг<br>
 F — автомобіль | Space — стрибок / дрифт</p>
</div>

<div id="hud">
 <b style="color:#00eaff">VICE CITY v1.1</b><br>
 Режим: <span id="mode">Пішохід</span><br>
 Швидкість: <span id="speed">0</span> км/год<br>
 Біг: <span id="run">Вимкнено</span><br>
 WASD — рух<br>
 Подвійне W — біг<br>
 F — сісти / вийти<br>
 Space — стрибок / дрифт<br>
 Мишка — камера
</div>

<div id="crosshair">+</div>
<div id="message">Знайди автомобіль і натисни F</div>

<script type="module">

import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ==================================
// СЦЕНА
// ==================================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x161b38);
scene.fog=new THREE.Fog(0x161b38,100,260);

const camera=new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,0.1,500
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

// ==================================
// СВІТЛО
// ==================================

scene.add(new THREE.HemisphereLight(0x9bbaff,0x343047,2));

const sunlight=new THREE.DirectionalLight(0xffc6a0,2.5);
sunlight.position.set(-40,90,30);
sunlight.castShadow=true;
sunlight.shadow.mapSize.set(2048,2048);
sunlight.shadow.camera.left=-100;
sunlight.shadow.camera.right=100;
sunlight.shadow.camera.top=100;
sunlight.shadow.camera.bottom=-100;
scene.add(sunlight);

// ==================================
// ФІЗИКА
// ==================================

const world=new CANNON.World({
 gravity:new CANNON.Vec3(0,-20,0)
});

world.broadphase=new CANNON.SAPBroadphase(world);
world.allowSleep=true;
world.defaultContactMaterial.friction=0.65;

const groundPhysics=new CANNON.Material('ground');
const vehiclePhysics=new CANNON.Material('vehicle');

world.addContactMaterial(
 new CANNON.ContactMaterial(
  groundPhysics,vehiclePhysics,
  {friction:0.65,restitution:0.05}
 )
);

const staticObjects=[];
const vehicles=[];

// ==================================
// МАТЕРІАЛИ
// ==================================

function material(color,roughness=0.7,metalness=0){
 return new THREE.MeshStandardMaterial({
  color,roughness,metalness
 });
}

const roadMaterial=material(0x292c3b);
const pavementMaterial=material(0x777b91);
const neonMaterial=new THREE.MeshBasicMaterial({color:0xff25c9});

// ==================================
// ЗЕМЛЯ
// ==================================

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(300,300),
 material(0x343b43)
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const groundBody=new CANNON.Body({
 mass:0,
 material:groundPhysics,
 shape:new CANNON.Plane()
});

groundBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(groundBody);

// ==================================
// ДОРОГИ
// ==================================

function road(x,z,w,d){

 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(w,d),
  roadMaterial
 );

 mesh.rotation.x=-Math.PI/2;
 mesh.position.set(x,0.025,z);
 scene.add(mesh);

 if(w>d){
  for(let i=-Math.floor(w/10);i<=Math.floor(w/10);i++){
   const line=new THREE.Mesh(
    new THREE.PlaneGeometry(3,0.16),
    new THREE.MeshBasicMaterial({color:0xffffff})
   );

   line.rotation.x=-Math.PI/2;
   line.position.set(x+i*10,0.04,z);
   scene.add(line);
  }
 }else{
  for(let i=-Math.floor(d/10);i<=Math.floor(d/10);i++){
   const line=new THREE.Mesh(
    new THREE.PlaneGeometry(0.16,3),
    new THREE.MeshBasicMaterial({color:0xffffff})
   );

   line.rotation.x=-Math.PI/2;
   line.position.set(x,0.04,z+i*10);
   scene.add(line);
  }
 }
}

for(let i=-2;i<=2;i++){
 road(i*50,0,12,280);
 road(0,i*50,280,12);
}

// ==================================
// СТАТИЧНІ БУДІВЛІ
// ==================================

function building(x,z,w,d,h,color){

 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material(color,0.65,0.25)
 );

 mesh.position.set(x,h/2,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);

 const body=new CANNON.Body({
  mass:0,
  material:groundPhysics,
  shape:new CANNON.Box(
   new CANNON.Vec3(w/2,h/2,d/2)
  )
 });

 body.position.set(x,h/2,z);
 world.addBody(body);

 // Вікна
 const windowMaterial=new THREE.MeshStandardMaterial({
  color:0x73dfff,
  emissive:0x1684bf,
  emissiveIntensity:1.5
 });

 for(let y=3;y<h-2;y+=4){
  for(let xx=-w/2+2;xx<w/2-1;xx+=3){

   const win=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,2,0.08),
    windowMaterial
   );

   win.position.set(x+xx,y,z+d/2+0.05);
   scene.add(win);

   const win2=win.clone();
   win2.position.z=z-d/2-0.05;
   scene.add(win2);
  }
 }

 // Неонова вивіска
 const neon=new THREE.Mesh(
  new THREE.BoxGeometry(w*0.7,0.5,0.15),
  neonMaterial
 );

 neon.position.set(x,h*0.45,z+d/2+0.1);
 scene.add(neon);
}

let seed=4321;

function random(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}

const colors=[
 0x283c68,0x54336a,0x31536e,
 0x533b64,0x293c50,0x70415e
];

for(let x=-2;x<=2;x++){
 for(let z=-2;z<=2;z++){

  for(const sx of [-1,1]){
   for(const sz of [-1,1]){

    const bx=x*50+sx*(13+random()*7);
    const bz=z*50+sz*(13+random()*7);

    const w=8+random()*6;
    const d=8+random()*6;
    const h=15+random()*35;

    building(
     bx,bz,w,d,h,
     colors[Math.floor(random()*colors.length)]
    );
   }
  }
 }
}

// ==================================
// ПАЛЬМИ
// ==================================

function palm(x,z){

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(0.25,0.45,5,8),
  material(0x81532d)
 );

 trunk.position.set(x,2.5,z);
 scene.add(trunk);

 for(let i=0;i<8;i++){

  const a=i*Math.PI/4;

  const leaf=new THREE.Mesh(
   new THREE.ConeGeometry(0.6,4.5,5),
   material(0x16935e)
  );

  leaf.position.set(
   x+Math.cos(a)*1.5,
   5.4,
   z+Math.sin(a)*1.5
  );

  leaf.rotation.z=Math.cos(a)*0.8;
  leaf.rotation.x=-Math.sin(a)*0.8;
  scene.add(leaf);
 }
}

for(let x=-2;x<=2;x++){
 for(let z=-2;z<=2;z++){
  palm(x*50+9,z*50+10);
  palm(x*50-9,z*50-10);
 }
}

// ==================================
// ТРАМПЛІНИ
// ==================================

function ramp(x,z){

 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(8,0.6,10),
  material(0xff27c5,0.35,0.3)
 );

 mesh.position.set(x,1,z);
 mesh.rotation.x=-0.22;
 mesh.castShadow=true;
 scene.add(mesh);
}

ramp(24,18);
ramp(-24,-18);

// ==================================
// ПЕРСОНАЖ
// ==================================

const player=new THREE.Group();
scene.add(player);

const clothes=material(0x243c75);
const skin=material(0xd69a75);
const pants=material(0x222536);

function characterPart(w,h,d,x,y,z,mat){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 player.add(mesh);
 return mesh;
}

characterPart(0.9,1.2,0.45,0,1.45,0,clothes);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.3,16,16),
 skin
);
head.position.y=2.25;
player.add(head);

const leg1=characterPart(0.3,0.85,0.35,-0.23,0.42,0,pants);
const leg2=characterPart(0.3,0.85,0.35,0.23,0.42,0,pants);

const arm1=characterPart(0.25,0.85,0.3,-0.58,1.45,0,skin);
const arm2=characterPart(0.25,0.85,0.3,0.58,1.45,0,skin);

const playerBody=new CANNON.Body({
 mass:70,
 material:vehiclePhysics,
 shape:new CANNON.Sphere(0.45),
 fixedRotation:true,
 linearDamping:0.8
});

playerBody.position.set(0,0.46,0);
world.addBody(playerBody);

// ==================================
// АВТОМОБІЛІ
// ==================================

function createCar(x,z,color,name){

 const group=new THREE.Group();
 scene.add(group);

 // Кузов
 const bodyMesh=new THREE.Mesh(
  new THREE.BoxGeometry(2,0.65,4.1),
  material(color,0.28,0.65)
 );

 bodyMesh.position.y=0.65;
 bodyMesh.castShadow=true;
 group.add(bodyMesh);

 // Дах
 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(1.65,0.75,1.9),
  material(0x263c55,0.25,0.6)
 );

 cabin.position.set(0,1.3,-0.2);
 group.add(cabin);

 // Скло
 const glass=new THREE.Mesh(
  new THREE.BoxGeometry(1.5,0.5,0.06),
  material(0x70caff,0.2,0.5)
 );

 glass.position.set(0,1.35,0.78);
 group.add(glass);

 // Фари
 for(const side of [-1,1]){

  const light=new THREE.Mesh(
   new THREE.BoxGeometry(0.45,0.16,0.08),
   new THREE.MeshBasicMaterial({color:0xffffff})
  );

  light.position.set(side*0.62,0.7,-2.08);
  group.add(light);

  const tail=new THREE.Mesh(
   new THREE.BoxGeometry(0.45,0.16,0.08),
   new THREE.MeshBasicMaterial({color:0xff1111})
  );

  tail.position.set(side*0.62,0.7,2.08);
  group.add(tail);
 }

 // Колеса
 const wheels=[];

 for(const side of [-1,1]){
  for(const front of [-1,1]){

   const wheelGroup=new THREE.Group();

   wheelGroup.position.set(
    side*1.02,0.42,front*1.3
   );

   const tire=new THREE.Mesh(
    new THREE.CylinderGeometry(0.4,0.4,0.25,20),
    material(0x111111)
   );

   tire.rotation.z=Math.PI/2;
   wheelGroup.add(tire);

   const hub=new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.2,0.27,12),
    material(0x999999,0.3,0.7)
   );

   hub.rotation.z=Math.PI/2;
   wheelGroup.add(hub);

   group.add(wheelGroup);
   wheels.push({mesh:wheelGroup,front:front===-1});
  }
 }

 const physicsBody=new CANNON.Body({
  mass:1200,
  material:vehiclePhysics,
  shape:new CANNON.Box(
   new CANNON.Vec3(0.95,0.4,2)
  ),
  linearDamping:0.12,
  angularDamping:0.65
 });

 physicsBody.position.set(x,0.55,z);
 world.addBody(physicsBody);

 const car={
  group,
  body:physicsBody,
  wheels,
  speed:0,
  steering:0,
  name
 };

 vehicles.push(car);
 return car;
}

// Автомобілі біля гравця
const sport=createCar(4, -4,0xff168c,'SPORT');
const sedan=createCar(-4,-5,0x008cff,'SEDAN');

// ==================================
// КЕРУВАННЯ
// ==================================

const keys={};

let lastW=0;
let running=false;

window.addEventListener('keydown',e=>{

 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){
  e.preventDefault();
 }

 if(e.code==='KeyW'&&!e.repeat&&!currentCar){

  const now=performance.now();

  if(now-lastW<350){
   running=true;
  }

  lastW=now;
 }

 keys[e.code]=true;

 if(e.code==='KeyF'&&!e.repeat){
  toggleCar();
 }
});

window.addEventListener('keyup',e=>{

 keys[e.code]=false;

 if(e.code==='KeyW'){
  running=false;
 }
});

// ==================================
// КАМЕРА
// ==================================

let yaw=0;
let pitch=0.12;
let locked=false;

renderer.domElement.addEventListener('click',()=>{
 renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange',()=>{
 locked=document.pointerLockElement===renderer.domElement;
});

document.addEventListener('mousemove',e=>{

 if(!locked)return;

 yaw-=e.movementX*0.002;
 pitch-=e.movementY*0.002;

 pitch=THREE.MathUtils.clamp(pitch,-0.45,0.8);
});

// ==================================
// АВТОМОБІЛЬ: ПОСАДКА / ВИХІД
// ==================================

let currentCar=null;

function toggleCar(){

 if(currentCar){

  const car=currentCar;

  const exit=new CANNON.Vec3(
   car.body.position.x+Math.cos(yaw)*3,
   0.46,
   car.body.position.z+Math.sin(yaw)*3
  );

  playerBody.position.copy(exit);
  playerBody.velocity.copy(car.body.velocity);

  player.visible=true;
  currentCar=null;
  running=false;

  document.getElementById('mode').textContent='Пішохід';

  return;
 }

 let nearest=null;
 let best=5;

 for(const car of vehicles){

  const dx=car.body.position.x-playerBody.position.x;
  const dz=car.body.position.z-playerBody.position.z;

  const dist=Math.hypot(dx,dz);

  if(dist<best){
   best=dist;
   nearest=car;
  }
 }

 if(nearest){

  currentCar=nearest;
  player.visible=false;
  playerBody.velocity.setZero();

  document.getElementById('mode').textContent='Водій';
 }
}

// ==================================
// РУХ ГРАВЦЯ
// ==================================

let grounded=false;
let animationTime=0;

function updatePlayer(dt){

 if(currentCar)return;

 const forward=new THREE.Vector3(
  -Math.sin(yaw),0,-Math.cos(yaw)
 );

 const right=new THREE.Vector3(
  Math.cos(yaw),0,-Math.sin(yaw)
 );

 const direction=new THREE.Vector3();

 if(keys.KeyW)direction.add(forward);
 if(keys.KeyS)direction.sub(forward);
 if(keys.KeyD)direction.add(right);
 if(keys.KeyA)direction.sub(right);

 if(direction.length()>0){

  direction.normalize();

  const velocity=running?12:5.5;

  playerBody.velocity.x=direction.x*velocity;
  playerBody.velocity.z=direction.z*velocity;

  player.rotation.y=Math.atan2(-direction.x,-direction.z);

  animationTime+=dt*(running?17:9);

  leg1.rotation.x=Math.sin(animationTime)*0.65;
  leg2.rotation.x=-Math.sin(animationTime)*0.65;

  arm1.rotation.x=-Math.sin(animationTime)*0.35;
  arm2.rotation.x=Math.sin(animationTime)*0.35;

 }else{

  playerBody.velocity.x*=0.7;
  playerBody.velocity.z*=0.7;

  leg1.rotation.x=0;
  leg2.rotation.x=0;
  arm1.rotation.x=0;
  arm2.rotation.x=0;
 }

 if(keys.Space&&grounded){
  playerBody.velocity.y=8;
  grounded=false;
 }

 if(playerBody.position.y<=0.46){
  playerBody.position.y=0.46;
  playerBody.velocity.y=Math.max(0,playerBody.velocity.y);
  grounded=true;
 }

 player.position.set(
  playerBody.position.x,
  playerBody.position.y-0.46,
  playerBody.position.z
 );
}

// ==================================
// ФІЗИКА АВТОМОБІЛЯ
// ==================================

function updateCar(car,dt){

 const body=car.body;

 const forward=new CANNON.Vec3();

 body.quaternion.vmult(
  new CANNON.Vec3(0,0,-1),
  forward
 );

 const right=new CANNON.Vec3();

 body.quaternion.vmult(
  new CANNON.Vec3(1,0,0),
  right
 );

 const velocity=body.velocity;
 const speed=velocity.dot(forward);

 if(currentCar===car){

  let acceleration=0;

  if(keys.KeyW)acceleration=25;
  if(keys.KeyS)acceleration=-20;

  const force=forward.scale(acceleration*body.mass);
  body.applyForce(force,body.position);

  let steer=0;

  if(keys.KeyA)steer=1;
  if(keys.KeyD)steer=-1;

  car.steering=THREE.MathUtils.lerp(
   car.steering,
   steer*0.55,
   Math.min(1,dt*5)
  );

  const steeringPower=THREE.MathUtils.clamp(
   1-Math.abs(speed)/55,0.2,1
  );

  body.angularVelocity.y=
   car.steering*speed*0.055*steeringPower;

  // Бічне зчеплення
  const sideSpeed=velocity.dot(right);

  const drift=keys.Space?0.15:0.8;

  body.applyForce(
   right.scale(-sideSpeed*body.mass*drift),
   body.position
  );

  if(keys.Space){
   body.angularDamping=0.18;
  }else{
   body.angularDamping=0.65;
  }

  if(!keys.KeyW&&!keys.KeyS){
   body.velocity.x*=0.995;
   body.velocity.z*=0.995;
  }

 }else{

  car.steering=THREE.MathUtils.lerp(
   car.steering,0,dt*3
  );

  const sideSpeed=velocity.dot(right);

  body.applyForce(
   right.scale(-sideSpeed*body.mass*0.8),
   body.position
  );
 }

 // Обертання коліс
 for(const wheel of car.wheels){

  wheel.mesh.children[0].rotation.x+=speed*dt*0.7;
  wheel.mesh.children[1].rotation.x+=speed*dt*0.7;

  if(wheel.front){
   wheel.mesh.rotation.y=car.steering*0.7;
  }
 }

 car.speed=speed;
}

// ==================================
// ОНОВЛЕННЯ МОДЕЛЕЙ
// ==================================

function syncModels(){

 player.position.set(
  playerBody.position.x,
  playerBody.position.y-0.46,
  playerBody.position.z
 );

 for(const car of vehicles){

  car.group.position.copy(car.body.position);
  car.group.quaternion.copy(car.body.quaternion);
 }
}

// ==================================
// КАМЕРА
// ==================================

const cameraTarget=new THREE.Vector3();

function updateCamera(dt){

 let target;
 let distance;
 let height;

 if(currentCar){

  target=currentCar.group.position.clone();
  target.y+=1;

  distance=9;
  height=3;

 }else{

  target=player.position.clone();
  target.y+=1.4;

  distance=6;
  height=2.3;
 }

 const direction=new THREE.Vector3(
  Math.sin(yaw)*Math.cos(pitch),
  Math.sin(pitch),
  Math.cos(yaw)*Math.cos(pitch)
 );

 const desired=target.clone().add(
  direction.multiplyScalar(distance)
 );

 desired.y+=height;

 camera.position.lerp(
  desired,1-Math.exp(-5*dt)
 );

 cameraTarget.lerp(
  target,1-Math.exp(-7*dt)
 );

 camera.lookAt(cameraTarget);
}

// ==================================
// HUD
// ==================================

function updateHUD(){

 document.getElementById('run').textContent=
  running?'Увімкнено':'Вимкнено';

 if(currentCar){

  document.getElementById('speed').textContent=
   Math.round(Math.abs(currentCar.speed)*3.6);

  message.textContent='F — вийти з автомобіля';

 }else{

  document.getElementById('speed').textContent='0';

  let nearby=false;

  for(const car of vehicles){

   const dx=car.body.position.x-playerBody.position.x;
   const dz=car.body.position.z-playerBody.position.z;

   if(Math.hypot(dx,dz)<5){
    nearby=true;
   }
  }

  message.textContent=nearby?
   'Натисни F, щоб сісти за кермо':
   'Досліджуй місто!';
 }
}

const message=document.getElementById('message');

// ==================================
// ГОЛОВНИЙ ЦИКЛ
// ==================================

const clock=new THREE.Clock();

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),0.033);

 updatePlayer(dt);

 for(const car of vehicles){
  updateCar(car,dt);
 }

 world.step(1/60,dt,5);

 grounded=playerBody.position.y<=0.47;

 syncModels();
 updateCamera(dt);
 updateHUD();

 renderer.render(scene,camera);
}

// ==================================
// ЗАПУСК
// ==================================

document.getElementById('play').addEventListener('click',()=>{

 document.getElementById('start').style.display='none';

 renderer.domElement.requestPointerLock();
});

camera.position.set(0,5,10);
camera.lookAt(0,0,0);

animate();

window.addEventListener('resize',()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
