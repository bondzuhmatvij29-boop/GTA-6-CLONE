function makeBox(parent,x,y,z,w,h,d,mat){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

// ДОРОГИ ТА ТРОТУАРИ
// =====================================================

for(let i=-2;i<=2;i++){

 makeBox(scene,0,.01,p,WORLD*2,.08,13,roadMat);

 makeBox(scene,0,.1,p-9,WORLD*2,.2,3,sidewalkMat);
}

for(let i=-2;i<=2;i++){
 for(let z=-200;z<=200;z+=12){

 }

// ПАЛЬМИ

const palmTrunk=material(0x81532b);

function makePalm(x,z){
 const group=new THREE.Group();
 group.position.set(x,0,z);

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.22,.4,5,8),palmTrunk
 );
 trunk.position.y=2.5;
 group.add(trunk);

 for(let i=0;i<8;i++){

   new THREE.ConeGeometry(.45,4,5),palmLeaves

   Math.sin(i*Math.PI/4)*1.5,4.9,
   Math.cos(i*Math.PI/4)*1.5
  );
  leaf.rotation.z=Math.PI/2;
  leaf.rotation.y=i*Math.PI/4;
  group.add(leaf);
 }
 scene.add(group);
}

for(let x=-195;x<=195;x+=25){
 for(let z=-195;z<=195;z+=25){

}

// =====================================================
// БУДИНКИ ТА ЇХНІ КОЛІЗІЇ
// =====================================================

const buildings=[];
const buildingColors=[
 0xf1c27d,0xe9a4a4,0xd4d8e8,0xf0e5c4,
 0xb9d5d8,0xe8c2a0,0xc8b5df
];

function makeBuilding(x,z,w,d,h,index){
 const group=new THREE.Group();
 group.position.set(x,0,z);

 makeBox(group,0,h/2,0,w,h,d,
  material(buildingColors[index%buildingColors.length]));

 makeBox(group,0,h+.12,0,w+.4,.25,d+.4,
  material(0x625d5a));

 const winMat=material(0x6aa6c5,.3);

 for(let y=2;y<h-1;y+=3){
  for(let px=-w/2+1.5;px<w/2-1;px+=3){
   makeBox(group,px,y,d/2+.04,1.2,1.5,.08,winMat);
   makeBox(group,px,y,-d/2-.04,1.2,1.5,.08,winMat);
  }
  for(let pz=-d/2+1.5;pz<d/2-1;pz+=3){
   makeBox(group,w/2+.04,y,pz,.08,1.5,1.2,winMat);
   makeBox(group,-w/2-.04,y,pz,.08,1.5,1.2,winMat);
  }
 }

 // Двері на передній стороні
 makeBox(group,0,1.1,d/2+.07,1.4,2.2,.13,
  material(0x513522));

 scene.add(group);

 const door=new THREE.Vector3(x,0,z+d/2+1.5);

 buildings.push({
  group,x,z,w,d,h,door,
  name:"Будинок "+(index+1)
 });
}

let buildingIndex=0;

for(let x=-175;x<=175;x+=35){
 for(let z=-175;z<=175;z+=35){
  if(Math.abs(x%70)<15||Math.abs(z%70)<15)continue;

  makeBuilding(
   x+(Math.random()-.5)*3,
   z+(Math.random()-.5)*3,
   13+Math.random()*4,
   12+Math.random()*4,
   10+Math.random()*20,
   buildingIndex++
  );
 }
}

// =====================================================
// ІНТЕР'ЄР
// =====================================================

const interior=new THREE.Group();
interior.position.y=INTERIOR_Y;
scene.add(interior);

makeBox(interior,0,-.3,0,22,.5,22,material(0xb8a58d));
makeBox(interior,0,2,-11,22,4,.5,material(0xe6d5bd));
makeBox(interior,0,2,11,22,4,.5,material(0xe6d5bd));
makeBox(interior,-11,2,0,.5,4,22,material(0xe6d5bd));
makeBox(interior,11,2,0,.5,4,22,material(0xe6d5bd));
makeBox(interior,0,4.1,0,22,.3,22,material(0xddd2c1));

const furniture=[];

function addFurniture(x,z,w,h,d,color){
 const mesh=makeBox(
  interior,x,h/2,z,w,h,d,material(color)
 );
 furniture.push({mesh,w,h,d});
 return mesh;
}

addFurniture(-4,-3,5,1,2,0x75452c);
addFurniture(4,3,3,.8,2,0x397b9b);
addFurniture(0,-8,2,2,.3,0x75452c);
addFurniture(-6,5,2,1,2,0x9b6844);
addFurniture(6,-5,2,1,2,0x9b6844);

let inside=false;
let savedPosition=new THREE.Vector3();
let heldFurniture=null;

// =====================================================
// ПЕРСОНАЖ
// =====================================================

const player=new THREE.Group();
const skin=material(0xe1ae82);
const shirt=material(0x2674a9);
const pants=material(0x33394a);

const torso=new THREE.Mesh(
 new THREE.BoxGeometry(.7,1,.4),shirt
);
torso.position.y=1.25;
player.add(torso);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.28,12,12),skin
);
head.position.y=2;
player.add(head);

const legs=[
 makeBox(player,-.2,.5,0,.22,.8,.25,pants),
 makeBox(player,.2,.5,0,.22,.8,.25,pants)
];

player.position.set(0,0,5);
scene.add(player);

let playerYaw=0;
let verticalSpeed=0;
let grounded=true;

// =====================================================
// КОЛІЗІЇ БУДИНКІВ
// =====================================================

function circleHitsBuilding(x,z,r){
 for(const b of buildings){
  const minX=b.x-b.w/2-r;
  const maxX=b.x+b.w/2+r;
  const minZ=b.z-b.d/2-r;
  const maxZ=b.z+b.d/2+r;

  if(x>minX&&x<maxX&&z>minZ&&z<maxZ){
   return b;
  }
 }
 return null;
}

function resolveBuildingCollision(object,r){
 const x=object.position.x;
 const z=object.position.z;

 for(const b of buildings){
  const minX=b.x-b.w/2-r;
  const maxX=b.x+b.w/2+r;
  const minZ=b.z-b.d/2-r;
  const maxZ=b.z+b.d/2+r;

  if(x>minX&&x<maxX&&z>minZ&&z<maxZ){
   const left=Math.abs(x-minX);
   const right=Math.abs(maxX-x);
   const top=Math.abs(z-minZ);
   const bottom=Math.abs(maxZ-z);
   const m=Math.min(left,right,top,bottom);

   if(m===left)object.position.x=minX;
   else if(m===right)object.position.x=maxX;
   else if(m===top)object.position.z=minZ;
   else object.position.z=maxZ;
  }
 }
}

// =====================================================
// МАШИНИ
// =====================================================

const cars=[];
const carColors=[
 0xe33a35,0x2475d2,0xf0c52e,0xeeeeee,
 0x252525,0x25a56a,0xb94bd1
];

function makeCar(x,z,color,traffic=false){
 const group=new THREE.Group();

 makeBox(group,0,.75,0,2,.8,4,material(color,.45));
 makeBox(group,0,1.35,-.15,1.65,.65,1.9,
  material(0x77b5d0,.25));

 const wheelMat=material(0x151515);
 const wheels=[];

 for(const wx of [-1.05,1.05]){
  for(const wz of [-1.25,1.25]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.38,.38,.25,12),
    wheelMat
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(wx,.38,wz);
   group.add(wheel);
   wheels.push(wheel);
  }
 }

 for(const hx of [-.65,.65]){
  makeBox(group,hx,.8,-2.02,.35,.2,.05,
   material(0xffffbb));
 }

 const smoke=new THREE.Mesh(
  new THREE.SphereGeometry(.25,8,8),
  new THREE.MeshBasicMaterial({
   color:0x777777,transparent:true,opacity:.45
  })
 );
 smoke.position.set(0,2,1);
 smoke.visible=false;
 group.add(smoke);

 group.position.set(x,0,z);
 scene.add(group);

 const car={
  group,wheels,smoke,
  speed:0,yaw:0,traffic,
  broken:false,
  repairable:false,
  routeIndex:0,
  color,
  collisionCooldown:0
 };

 cars.push(car);
 return car;
}

makeCar(4,5,0xe33a35);
makeCar(-4,5,0x2475d2);
makeCar(17,17,0xf0c52e);
makeCar(-17,-17,0xeeeeee);
makeCar(53,18,0x25a56a);
makeCar(-53,-18,0xb94bd1);

// Машина для першого ремонту
const brokenCar=makeCar(15,-12,0x888888);
brokenCar.broken=true;
brokenCar.repairable=true;
brokenCar.smoke.visible=true;

// =====================================================
// МІСЬКИЙ ТРАФІК
// =====================================================

const route=[
 new THREE.Vector3(-195,0,-70),
 new THREE.Vector3(195,0,-70),
 new THREE.Vector3(195,0,70),
 new THREE.Vector3(-195,0,70)
];

for(let i=0;i<12;i++){
 const car=makeCar(
  -170+i*28,
  i%2===0?-70:70,
  carColors[i%carColors.length],
  true
 );
 car.routeIndex=i%route.length;
 car.speed=8+Math.random()*4;
}

// =====================================================
// ПІШОХОДИ ТА ЇХНІ БУДИНКИ
// =====================================================

const pedestrians=[];
const peopleColors=[
 0xe14b4b,0x3e70d4,0xe0b72d,0xeeeeee,
 0x44a76b,0x9d54c4,0x222222
];

function makePerson(x,z){
 const group=new THREE.Group();

 const shirtMat=material(
  peopleColors[Math.floor(Math.random()*peopleColors.length)]
 );

 const torso=new THREE.Mesh(
  new THREE.BoxGeometry(.45,.85,.3),shirtMat
 );
 torso.position.y=1.1;
 group.add(torso);

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.2,10,10),skin
 );
 h.position.y=1.7;
 group.add(h);

 const personLegs=[
  makeBox(group,-.12,.45,0,.14,.7,.16,pants),
  makeBox(group,.12,.45,0,.14,.7,.16,pants)
 ];

 group.position.set(x,0,z);
 scene.add(group);

 const home=buildings[
  Math.floor(Math.random()*buildings.length)
 ];

 pedestrians.push({
  group,legs:personLegs,
  direction:Math.random()*Math.PI*2,
  speed:1+Math.random()*1.2,
  change:2+Math.random()*5,
  home,
  goingHome:false,
  hidden:false
 });
}

for(let i=0;i<45;i++){
 makePerson(
  (Math.random()-.5)*370,
  (Math.random()-.5)*370
 );
}

// =====================================================
// ЧАС ДОБИ
// =====================================================

let gameMinutes=12*60;
let night=false;

function updateDay(dt){
 gameMinutes+=dt*2.5;
 if(gameMinutes>=1440)gameMinutes-=1440;

 const hour=Math.floor(gameMinutes/60);
 const minute=Math.floor(gameMinutes%60);

 document.getElementById("time").textContent=
  String(hour).padStart(2,"0")+":"+
  String(minute).padStart(2,"0");

 const isNight=hour>=20||hour<6;

 if(isNight!==night){
  night=isNight;
  showMessage(night?
   "Настала ніч. Люди повертаються додому.":
   "Настав ранок. Місто прокидається."
  );
 }

 const daylight=night?.22:1;
 sun.intensity=daylight*2;
 scene.background.set(night?0x17233f:0x83c9e8);
 scene.fog.color.set(night?0x17233f:0x83c9e8);
}

// =====================================================
// КЕРУВАННЯ
// =====================================================

const keys={};
let lastW=0;
let running=false;
let currentCar=null;
let messageTimer=0;
let money=250;
let repairedCount=0;

function showMessage(text){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.display="block";
 messageTimer=2.7;
}

function setMoney(value){
 money=Math.max(0,money+value);
 document.getElementById("money").textContent="$"+money;
}

addEventListener("keydown",e=>{
 if(keys[e.code])return;
 keys[e.code]=true;

 if(e.code==="KeyW"){
  const now=performance.now();
  if(now-lastW<350)running=true;
  lastW=now;
 }

 if(e.code==="KeyF")toggleCar();
 if(e.code==="KeyE")interact();
 if(e.code==="KeyG")moveFurniture();
});

addEventListener("keyup",e=>{
 keys[e.code]=false;
 if(e.code==="KeyW")running=false;
});

let cameraYaw=0;
let cameraPitch=.25;

renderer.domElement.addEventListener("click",()=>{
 renderer.domElement.requestPointerLock?.();
});

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===renderer.domElement){
  cameraYaw-=e.movementX*.0025;
  cameraPitch-=e.movementY*.002;
  cameraPitch=THREE.MathUtils.clamp(cameraPitch,-.1,.8);
 }
});

// =====================================================
// ПОШУК МАШИНИ
// =====================================================

function nearestCar(){
 let result=null;
 let distance=5;

 for(const car of cars){
  if(car.traffic)continue;
  const d=player.position.distanceTo(car.group.position);
  if(d<distance){
   distance=d;
   result=car;
  }
 }
 return result;
}

function toggleCar(){
 if(currentCar){
  const car=currentCar;
  const side=new THREE.Vector3(2.2,0,0);
  side.applyAxisAngle(new THREE.Vector3(0,1,0),car.yaw);

  player.position.copy(car.group.position).add(side);
  player.position.y=inside?INTERIOR_Y:0;
  playerYaw=car.yaw;
  player.visible=true;
  currentCar=null;

  showMessage("Ти вийшов з автомобіля");
  return;
 }

 if(inside){
  showMessage("Спочатку вийди з будинку");
  return;
 }

 const car=nearestCar();

 if(!car){
  showMessage("Поруч немає автомобіля");
  return;
 }

 if(car.broken){
  showMessage("Цей автомобіль зламаний. Спочатку відремонтуй його!");
  return;
 }

 currentCar=car;
 player.visible=false;
 car.speed=0;
 showMessage("Ти сів у автомобіль!");
}

// =====================================================
// ДВЕРІ ТА РЕМОНТ
// =====================================================

function nearestBrokenCar(){
 let found=null;
 let distance=7;

 for(const car of cars){
  if(!car.broken)continue;
  const d=player.position.distanceTo(car.group.position);
  if(d<distance){
   distance=d;
   found=car;
  }
 }
 return found;
}

function repairCar(){
 const car=nearestBrokenCar();

 if(!car)return false;

 car.broken=false;
 car.speed=0;
 car.smoke.visible=false;
 car.repairable=false;

 setMoney(75);
 repairedCount++;

 document.getElementById("job").textContent=
  "Механік: "+repairedCount+" ремонтів";

 showMessage("Автомобіль відремонтовано! +$75");
 return true;
}

function interact(){
 if(currentCar){
  showMessage("Вийди з автомобіля, щоб взаємодіяти");
  return;
 }

 if(inside){
  showMessage("Ти зараз у будинку");
  return;
 }

 if(repairCar())return;

 let nearest=null;
 let distance=4.5;

 for(const b of buildings){
  const d=player.position.distanceTo(b.door);
  if(d<distance){
   nearest=b;
   distance=d;
  }
 }

 if(!nearest){
  showMessage("Підійди до дверей будинку або зламаної машини");
  return;
 }

 savedPosition.copy(player.position);
 player.position.set(0,INTERIOR_Y,2);
 playerYaw=0;
 inside=true;
 showMessage("Ти зайшов у "+nearest.name);
}

// =====================================================
// ПЕРЕСУВАННЯ МЕБЛІВ
// =====================================================

function moveFurniture(){
 if(!inside){
  showMessage("Меблі можна рухати тільки в будинку");
  return;
 }

 if(heldFurniture){
  heldFurniture=null;
  showMessage("Предмет поставлено");
  return;
 }

 let nearest=null;
 let distance=3.5;

 for(const f of furniture){
  const p=f.mesh.getWorldPosition(new THREE.Vector3());
  const d=player.position.distanceTo(p);

  if(d<distance){
   distance=d;
   nearest=f;
  }
 }

 if(!nearest){
  showMessage("Підійди ближче до меблів");
  return;
 }

 heldFurniture=nearest;
 showMessage("Предмет піднято. Натисни G, щоб поставити.");
}

// =====================================================
// РУХ ГРАВЦЯ
// =====================================================

function updatePlayer(dt){
 if(currentCar)return;

 const floorY=inside?INTERIOR_Y:0;

 let forward=0;
 let side=0;

 if(keys.KeyW)forward++;
 if(keys.KeyS)forward--;
 if(keys.KeyA)side--;
 if(keys.KeyD)side++;

 const direction=new THREE.Vector3(
  -Math.sin(cameraYaw),0,-Math.cos(cameraYaw)
 );

 const right=new THREE.Vector3(
  Math.cos(cameraYaw),0,-Math.sin(cameraYaw)
 );

 const move=new THREE.Vector3();
 move.addScaledVector(direction,forward);
 move.addScaledVector(right,side);

 if(move.lengthSq()>0){
  move.normalize();

  const speed=running?9:5;
  const oldX=player.position.x;
  const oldZ=player.position.z;

  player.position.addScaledVector(move,speed*dt);

  if(inside){
   player.position.x=THREE.MathUtils.clamp(
    player.position.x,-9.5,9.5
   );
   player.position.z=THREE.MathUtils.clamp(
    player.position.z,-9.5,9.5
   );

   if(heldFurniture){
    heldFurniture.mesh.position.x=
     player.position.x-interior.position.x;
    heldFurniture.mesh.position.z=
     player.position.z-interior.position.z-1.5;
   }
  }else{
   resolveBuildingCollision(player,.4);

   player.position.x=THREE.MathUtils.clamp(
    player.position.x,-WORLD,WORLD
   );
   player.position.z=THREE.MathUtils.clamp(
    player.position.z,-WORLD,WORLD
   );
  }

  playerYaw=Math.atan2(-move.x,-move.z);
  player.rotation.y=playerYaw;
 }

 if(!inside){
  if(keys.Space&&grounded){
   verticalSpeed=7;
   grounded=false;
  }

  verticalSpeed-=18*dt;
  player.position.y+=verticalSpeed*dt;

  if(player.position.y<=0){
   player.position.y=0;
   verticalSpeed=0;
   grounded=true;
  }
 }else{
  player.position.y=INTERIOR_Y;
  verticalSpeed=0;
  grounded=true;
 }

 const walk=Math.sin(performance.now()*.009)*.18;
 legs[0].rotation.x=walk;
 legs[1].rotation.x=-walk;
}

// =====================================================
// АВТОМОБІЛЬ ГРАВЦЯ
// =====================================================

function updatePlayerCar(dt){
 if(!currentCar)return;

 const car=currentCar;

 if(car.broken)return;

 if(keys.KeyW)car.speed+=19*dt;
 if(keys.KeyS)car.speed-=23*dt;

 if(!keys.KeyW&&!keys.KeyS){
  car.speed*=Math.pow(.965,dt*60);
 }

 car.speed*=Math.pow(.992,dt*60);
 car.speed=THREE.MathUtils.clamp(car.speed,-18,38);

 const steer=(keys.KeyA?1:0)-(keys.KeyD?1:0);
 const steerPower=Math.min(Math.abs(car.speed)/8,1);

 car.yaw+=steer*steerPower*1.8*dt*
  (car.speed>=0?1:-1);

 car.group.rotation.y=car.yaw;

 const forward=new THREE.Vector3(
  -Math.sin(car.yaw),0,-Math.cos(car.yaw)
 );

 const old=car.group.position.clone();
 car.group.position.addScaledVector(forward,car.speed*dt);
 car.group.position.y=0;

 resolveBuildingCollision(car.group,1.2);

 if(circleHitsBuilding(
  car.group.position.x,car.group.position.z,1.2
  )){
  car.speed=0;
 }

 for(const wheel of car.wheels){
  wheel.rotation.x+=car.speed*dt*2;
 }

 car.group.position.x=THREE.MathUtils.clamp(
  car.group.position.x,-WORLD+3,WORLD-3
 );
 car.group.position.z=THREE.MathUtils.clamp(
  car.group.position.z,-WORLD+3,WORLD-3
 );
}

// =====================================================
// ТРАФІК
// =====================================================

function updateTraffic(dt){
 for(const car of cars){
  if(!car.traffic||car.broken)continue;

  const target=route[car.routeIndex];
  const dx=target.x-car.group.position.x;
  const dz=target.z-car.group.position.z;
  const distance=Math.hypot(dx,dz);

  if(distance<6){
   car.routeIndex=(car.routeIndex+1)%route.length;
   continue;
  }

  const desiredYaw=Math.atan2(-dx,-dz);
  let diff=desiredYaw-car.yaw;

  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;

  car.yaw+=THREE.MathUtils.clamp(diff,-2*dt,2*dt);
  car.group.rotation.y=car.yaw;

  const forward=new THREE.Vector3(
   -Math.sin(car.yaw),0,-Math.cos(car.yaw)
  );

  // Трафік пригальмовує перед іншими авто
  let blocked=false;

  for(const other of cars){
   if(other===car)continue;

   const d=car.group.position.distanceTo(other.group.position);
   if(d<5){
    blocked=true;
    break;
   }
  }

  // Пішоходи: автомобілі пригальмовують і не наїжджають
  for(const p of pedestrians){
   if(p.hidden||p.goingHome)continue;

   const d=car.group.position.distanceTo(p.group.position);
   if(d<4){
    blocked=true;
    break;
   }
  }

  const desiredSpeed=blocked?0:car.speed;
  car.group.position.addScaledVector(
   forward,desiredSpeed*dt
  );

  car.group.position.y=0;
  resolveBuildingCollision(car.group,1.2);
 }
}

// =====================================================
// ЗІТКНЕННЯ МІЖ АВТОМОБІЛЯМИ
// =====================================================

function updateCarCollisions(){
 for(let i=0;i<cars.length;i++){
  for(let j=i+1;j<cars.length;j++){
   const a=cars[i];
   const b=cars[j];

   const dx=b.group.position.x-a.group.position.x;
   const dz=b.group.position.z-a.group.position.z;
   const distance=Math.hypot(dx,dz);

   if(distance<2.5&&distance>.001){
    const nx=dx/distance;
    const nz=dz/distance;
    const overlap=2.5-distance;

    a.group.position.x-=nx*overlap*.5;
    a.group.position.z-=nz*overlap*.5;
    b.group.position.x+=nx*overlap*.5;
    b.group.position.z+=nz*overlap*.5;

    const relative=Math.abs(a.speed-b.speed);

    a.speed*=.35;
    b.speed*=.45;

    if((a===currentCar||b===currentCar)){
     const playerCar=a===currentCar?a:b;

     if(playerCar.collisionCooldown<=0){
      setMoney(-10);
      playerCar.collisionCooldown=2;
      showMessage("ДТП! Штраф -$10");
     }
    }
   }
  }
 }
}

// =====================================================
// ПОЛОМКИ МАШИН ТА РОБОТА МЕХАНІКА
// =====================================================

let breakdownTimer=35;

function updateBreakdowns(dt){
 breakdownTimer-=dt;

 if(breakdownTimer>0)return;

 breakdownTimer=35+Math.random()*35;

 const candidates=cars.filter(c=>
  c.traffic&&!c.broken&&c!==currentCar
 );

 if(candidates.length===0)return;

 const car=candidates[
  Math.floor(Math.random()*candidates.length)
 ];

 car.broken=true;
 car.speed=0;
 car.smoke.visible=true;

 showMessage("У місті зламався автомобіль! Можна заробити на ремонті.");
}

// =====================================================
// ПІШОХОДИ ТА НІЧ
// =====================================================

function updatePeople(dt){
 let visibleCount=0;

 for(const p of pedestrians){
  const home=p.home;
  const homeDoor=home.door;

  if(night){
   p.goingHome=true;
  }else{
   p.goingHome=false;
   p.hidden=false;
   p.group.visible=true;
  }

  if(p.goingHome){
   const dx=homeDoor.x-p.group.position.x;
   const dz=homeDoor.z-p.group.position.z;
   const distance=Math.hypot(dx,dz);

   if(distance<2.5){
    p.hidden=true;
    p.group.visible=false;
    continue;
   }

   p.hidden=false;
   p.group.visible=true;

   const direction=Math.atan2(dx,dz);
   p.group.position.x+=Math.sin(direction)*p.speed*dt;
   p.group.position.z+=Math.cos(direction)*p.speed*dt;
   p.group.rotation.y=direction;
  }else{
   p.change-=dt;

   if(p.change<=0){
    p.direction+=(Math.random()-.5)*2.5;
    p.change=2+Math.random()*5;
   }

   p.group.position.x+=Math.sin(p.direction)*p.speed*dt;
   p.group.position.z+=Math.cos(p.direction)*p.speed*dt;
   p.group.rotation.y=p.direction;

   if(Math.abs(p.group.position.x)>WORLD-5||
      Math.abs(p.group.position.z)>WORLD-5){
    p.direction+=Math.PI;
   }

   if(circleHitsBuilding(
    p.group.position.x,p.group.position.z,.35
   )){
    p.direction+=Math.PI;
   }
  }

  if(p.group.visible){
   visibleCount++;
   const walk=Math.sin(performance.now()*.008)*.12;
   p.legs[0].rotation.x=walk;
   p.legs[1].rotation.x=-walk;
  }
 }

 document.getElementById("people").textContent=visibleCount;
}

// =====================================================
// КАМЕРА
// =====================================================

function updateCamera(dt){
 let target;
 let distance=9;
 let height=4;

 if(currentCar){
  target=currentCar.group.position.clone();
  distance=11;
  height=5;
 }else{
  target=player.position.clone();
 }

 const offset=new THREE.Vector3(
  Math.sin(cameraYaw)*distance,
  height+cameraPitch*5,
  Math.cos(cameraYaw)*distance
 );

 const desired=target.clone().add(offset);
 camera.position.lerp(desired,Math.min(1,dt*6));
 camera.lookAt(target.x,target.y+1.2,target.z);
}

// =====================================================
// HUD
// =====================================================

function updateHUD(){
 document.getElementById("status").textContent=
  inside?"У будинку":
  currentCar?"За кермом":"Пішохід";

 document.getElementById("speed").textContent=
  currentCar?
  Math.round(Math.abs(currentCar.speed)*3.6):0;

 document.getElementById("job").textContent=
  "Механік: "+repairedCount+" ремонтів";
}

// =====================================================
// ГОЛОВНИЙ ЦИКЛ
// =====================================================

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.033);

 updateDay(dt);
 updatePlayer(dt);
 updatePlayerCar(dt);
 updateTraffic(dt);
 updatePeople(dt);
 updateCarCollisions();
 updateBreakdowns(dt);

 for(const car of cars){
  car.collisionCooldown=Math.max(0,car.collisionCooldown-dt);
 }

 updateCamera(dt);
 updateHUD();

 if(messageTimer>0){
  messageTimer-=dt;
  if(messageTimer<=0){
   document.getElementById("message").style.display="none";
  }
 }

 renderer.render(scene,camera);
}

updateCamera(1);
animate();

// =====================================================
// ЗМІНА РОЗМІРУ ЕКРАНА
// =====================================================

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
