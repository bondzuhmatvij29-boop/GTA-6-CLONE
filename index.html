
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vice City — Open World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#83c9e8;font-family:Arial}
canvas{display:block}
#hud{
 position:fixed;left:15px;top:15px;color:white;
 background:#101827cc;padding:12px 16px;border-radius:10px;
 font-size:14px;line-height:1.7;pointer-events:none;
 text-shadow:1px 1px 2px #000
}
#help{
 position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
 color:white;background:#101827dd;padding:10px 16px;
 border-radius:9px;text-align:center;font-size:13px;
 pointer-events:none;max-width:95%;white-space:normal
}
#message{
 position:fixed;top:20px;left:50%;transform:translateX(-50%);
 color:white;background:#111c;padding:10px 18px;
 border-radius:8px;display:none;pointer-events:none
}
#crosshair{
 position:fixed;left:50%;top:50%;width:5px;height:5px;
 background:white;border-radius:50%;pointer-events:none
}
</style>
</head>
<body>

<div id="hud">
<b>VICE CITY</b><br>
Гроші: $250<br>
Статус: <span id="status">Пішохід</span><br>
Швидкість: <span id="speed">0</span> км/год<br>
Людей у місті: <span id="people">0</span>
</div>

<div id="message"></div>
<div id="crosshair"></div>
<div id="help">
WASD — рух | Подвійне W — біг | Space — стрибок<br>
F — сісти в машину / вийти | E — зайти в будинок / вийти<br>
Мишка — камера | Клік по екрану — захопити мишку
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x83c9e8);
scene.fog = new THREE.Fog(0x83c9e8, 90, 280);

const camera = new THREE.PerspectiveCamera(
 70, innerWidth/innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x536477,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,100,30);
sun.castShadow=true;
scene.add(sun);

const clock = new THREE.Clock();

const mat = (color,roughness=0.85) =>
 new THREE.MeshStandardMaterial({color,roughness});

const groundMat=mat(0x6eaa62);
const roadMat=mat(0x30343b);
const sidewalkMat=mat(0xb8b5a9);
const whiteMat=mat(0xffffff);

function box(parent,x,y,z,w,h,d,material){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

// Земля
box(scene,0,-0.35,0,300,0.5,300,groundMat);

// Дороги
for(let i=-2;i<=2;i++){
 box(scene,i*35,0.01,0,12,0.08,300,roadMat);
 box(scene,0,0.01,i*35,300,0.08,12,roadMat);
}

// Розмітка доріг
for(let i=-2;i<=2;i++){
 for(let z=-140;z<145;z+=12){
  box(scene,i*35,0.07,z,0.18,0.025,5,whiteMat);
 }
 for(let x=-140;x<145;x+=12){
  box(scene,x,0.07,i*35,5,0.025,0.18,whiteMat);
 }
}

// Тротуари
for(let i=-2;i<=2;i++){
 for(const side of [-8,8]){
  box(scene,i*35+side,0.12,0,3,0.22,300,sidewalkMat);
  box(scene,0,0.12,i*35+side,300,0.22,3,sidewalkMat);
 }
}

// Пальми
const palmMat=mat(0x81532b);
const leafMat=mat(0x187b43);

function makePalm(x,z){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.4,5,8),palmMat
 );
 trunk.position.y=2.5;
 group.add(trunk);

 for(let i=0;i<8;i++){
  const leaf=new THREE.Mesh(
   new THREE.ConeGeometry(.45,4,5),leafMat
  );
  leaf.position.set(
   Math.sin(i*Math.PI/4)*1.5,
   4.9,
   Math.cos(i*Math.PI/4)*1.5
  );
  leaf.rotation.z=Math.PI/2;
  leaf.rotation.y=i*Math.PI/4;
  group.add(leaf);
 }
 scene.add(group);
}

for(let x=-130;x<=130;x+=17){
 for(let z=-130;z<=130;z+=17){
  if(Math.abs(x%35)>10 && Math.abs(z%35)>10){
   if(Math.random()>.35)makePalm(x,z);
  }
 }
}

// Будинки
const buildings=[];
const buildingColors=[
 0xf1c27d,0xe9a4a4,0xd4d8e8,0xf0e5c4,
 0xb9d5d8,0xe8c2a0,0xc8b5df
];

function makeBuilding(x,z,w,d,h,index){
 const color=buildingColors[index%buildingColors.length];
 const group=new THREE.Group();
 group.position.set(x,0,z);

 box(group,0,h/2,0,w,h,d,mat(color));

 // Дах
 box(group,0,h+0.12,0,w+.4,.25,d+.4,mat(0x625d5a));

 // Вікна
 const windowMat=mat(0x6aa6c5,.3);
 for(let y=2;y<h-1;y+=3){
  for(let px=-w/2+1.5;px<w/2-1;px+=3){
   box(group,px,y,d/2+.03,1.2,1.5,.08,windowMat);
   box(group,px,y,-d/2-.03,1.2,1.5,.08,windowMat);
  }
  for(let pz=-d/2+1.5;pz<d/2-1;pz+=3){
   box(group,w/2+.03,y,pz,.08,1.5,1.2,windowMat);
   box(group,-w/2-.03,y,pz,.08,1.5,1.2,windowMat);
  }
 }

 // Двері на передній стороні будинку
 const door=box(group,0,1.1,d/2+.06,1.4,2.2,.12,mat(0x513522));
 scene.add(group);

 const doorWorld=new THREE.Vector3(x,0,z+d/2+1.5);
 buildings.push({
  group,doorWorld,
  name:"Будинок "+(index+1)
 });
}

// Розміщуємо будинки між дорогами
let buildingIndex=0;
for(let x=-125;x<=125;x+=35){
 for(let z=-125;z<=125;z+=35){
  if(Math.abs(x%35)<1 || Math.abs(z%35)<1)continue;
  makeBuilding(
   x+(Math.random()-.5)*4,
   z+(Math.random()-.5)*4,
   13+Math.random()*5,
   12+Math.random()*5,
   9+Math.random()*18,
   buildingIndex++
  );
 }
}

// Інтер'єр будинку — окрема кімната під містом
const interiorY=-30;
const interior=new THREE.Group();
interior.position.y=interiorY;
scene.add(interior);

box(interior,0,-.3,0,22,.5,22,mat(0xb8a58d));
box(interior,0,2,-11,22,4,.5,mat(0xe6d5bd));
box(interior,0,2,11,22,4,.5,mat(0xe6d5bd));
box(interior,-11,2,0,.5,4,22,mat(0xe6d5bd));
box(interior,11,2,0,.5,4,22,mat(0xe6d5bd));
box(interior,0,4.1,0,22,.3,22,mat(0xddd2c1));

// Меблі
box(interior,-4,.55,-3,5,1,2,mat(0x75452c));
box(interior,4,.4,3,3,.8,2,mat(0x397b9b));
box(interior,0,1.5,-9,2,3,.15,mat(0x75452c));

let inside=false;
let savedPosition=new THREE.Vector3();

// Персонаж
const player=new THREE.Group();
const skin=mat(0xe1ae82);
const shirt=mat(0x2674a9);
const pants=mat(0x33394a);

const body= new THREE.Mesh(
 new THREE.BoxGeometry(.7,1,.4),shirt
);
body.position.y=1.25;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.28,12,12),skin
);
head.position.y=2;
player.add(head);

const leg1=box(player,-.2,.5,0,.22,.8,.25,pants);
const leg2=box(player,.2,.5,0,.22,.8,.25,pants);

player.position.set(0,0,5);
scene.add(player);

let playerYaw=0;
let verticalSpeed=0;
let grounded=true;

// Машини
const cars=[];
const carColors=[
 0xe33a35,0x2475d2,0xf0c52e,0xeeeeee,
 0x252525,0x25a56a,0xb94bd1
];

function makeCar(x,z,color,traffic=false){
 const group=new THREE.Group();

 const bodyMesh=box(
  group,0,.75,0,2,0.8,4,mat(color,.45)
 );
 box(group,0,1.35,-.15,1.65,.65,1.9,mat(0x77b5d0,.25));

 const wheelMat=mat(0x151515);
 const wheels=[];

 for(const wx of [-1.05,1.05]){
  for(const wz of [-1.25,1.25]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.38,.38,.25,12),
    wheelMat
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(wx,.38,wz);
   group.add(wheel);
   wheels.push(wheel);
  }
 }

 // Фари
 for(const hx of [-.65,.65]){
  box(group,hx,.8,-2.02,.35,.2,.05,mat(0xffffbb));
 }

 group.position.set(x,0,z);
 scene.add(group);

 const car={
  group,
  speed:0,
  yaw:0,
  traffic,
  wheels,
  routeIndex:0,
  color
 };
 cars.push(car);
 return car;
}

// Припарковані автомобілі
const parkedCars=[
 makeCar(4,5,0xe33a35),
 makeCar(-4,5,0x2475d2),
 makeCar(17,17,0xf0c52e),
 makeCar(-17,-17,0xeeeeee),
 makeCar(53,18,0x25a56a),
 makeCar(-53,-18,0xb94bd1)
];

// Маршрут трафіку
const route=[
 new THREE.Vector3(-140,0,-35),
 new THREE.Vector3(140,0,-35),
 new THREE.Vector3(140,0,35),
 new THREE.Vector3(-140,0,35)
];

for(let i=0;i<8;i++){
 const car=makeCar(
  -110+i*30,
  i%2===0?-35:35,
  carColors[i%carColors.length],
  true
 );
 car.routeIndex=i%route.length;
 car.speed=7+Math.random()*4;
}

// Пішоходи
const pedestrians=[];
const peopleColors=[
 0xe14b4b,0x3e70d4,0xe0b72d,0xeeeeee,
 0x44a76b,0x9d54c4,0x222222
];

function makePerson(x,z){
 const group=new THREE.Group();
 const color=peopleColors[
  Math.floor(Math.random()*peopleColors.length)
 ];
 const shirtMat=mat(color);

 const torso=new THREE.Mesh(
  new THREE.BoxGeometry(.45,.85,.3),shirtMat
 );
 torso.position.y=1.1;
 group.add(torso);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.2,10,10),skin
 );
 head.position.y=1.7;
 group.add(head);

 const legs=[];
 for(const px of [-.12,.12]){
  const leg=box(group,px,.45,0,.14,.7,.16,pants);
  legs.push(leg);
 }

 group.position.set(x,0,z);
 scene.add(group);

 pedestrians.push({
  group,legs,
  direction:Math.random()*Math.PI*2,
  speed:1+Math.random()*1.2,
  change:2+Math.random()*5
 });
}

for(let i=0;i<35;i++){
 makePerson(
  (Math.random()-.5)*240,
  (Math.random()-.5)*240
 );
}

// Керування
const keys={};
let lastW=0;
let running=false;
let currentCar=null;
let messageTimer=0;

function showMessage(text){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.display="block";
 messageTimer=2.5;
}

addEventListener("keydown",e=>{
 if(keys[e.code])return;
 keys[e.code]=true;

 if(e.code==="KeyW"){
  const now=performance.now();
  if(now-lastW<350)running=true;
  lastW=now;
 }

 if(e.code==="KeyF")toggleCar();
 if(e.code==="KeyE")useDoor();
});

addEventListener("keyup",e=>{
 keys[e.code]=false;
 if(e.code==="KeyW")running=false;
});

let cameraYaw=0;
let cameraPitch=.25;

renderer.domElement.addEventListener("click",()=>{
 renderer.domElement.requestPointerLock?.();
});

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===renderer.domElement){
  cameraYaw-=e.movementX*.0025;
  cameraPitch-=e.movementY*.002;
  cameraPitch=THREE.MathUtils.clamp(cameraPitch,-.1,.8);
 }
});

// Машини: посадка та вихід
function nearestCar(){
 let result=null;
 let distance=5;

 for(const car of cars){
  if(car.traffic)continue;
  const d=player.position.distanceTo(car.group.position);
  if(d<distance){
   distance=d;
   result=car;
  }
 }
 return result;
}

function toggleCar(){
 if(currentCar){
  const car=currentCar;
  const side=new THREE.Vector3(2,0,0);
  side.applyAxisAngle(new THREE.Vector3(0,1,0),car.yaw);

  player.position.copy(car.group.position).add(side);
  player.position.y=0;
  playerYaw=car.yaw;
  currentCar=null;
  showMessage("Ти вийшов з автомобіля");
  return;
 }

 if(inside){
  showMessage("Спочатку вийди з будинку");
  return;
 }

 const car=nearestCar();
 if(!car){
  showMessage("Поруч немає автомобіля");
  return;
 }

 currentCar=car;
 car.speed=0;
 showMessage("Ти сів у автомобіль!");
}

// Двері будинків
function useDoor(){
 if(currentCar){
  showMessage("Спочатку вийди з автомобіля");
  return;
 }

 if(inside){
  inside=false;
  player.position.copy(savedPosition);
  showMessage("Ти вийшов на вулицю");
  return;
 }

 let nearest=null;
 let distance=4;

 for(const b of buildings){
  const d=player.position.distanceTo(b.doorWorld);
  if(d<distance){
   nearest=b;
   distance=d;
  }
 }

 if(!nearest){
  showMessage("Підійди ближче до дверей будинку");
  return;
 }

 savedPosition.copy(player.position);
 player.position.set(0,interiorY,2);
 inside=true;
 showMessage("Ти зайшов у "+nearest.name);
}

// Рух пішохода
function updatePlayer(dt){
 if(currentCar||inside)return;

 let forward=0;
 let side=0;

 if(keys.KeyW)forward+=1;
 if(keys.KeyS)forward-=1;
 if(keys.KeyA)side-=1;
 if(keys.KeyD)side+=1;

 const direction=new THREE.Vector3(
  -Math.sin(cameraYaw),0,-Math.cos(cameraYaw)
 );
 const right=new THREE.Vector3(
  Math.cos(cameraYaw),0,-Math.sin(cameraYaw)
 );

 const move=new THREE.Vector3();
 move.addScaledVector(direction,forward);
 move.addScaledVector(right,side);

 if(move.lengthSq()>0){
  move.normalize();
  const speed=running?10:5;
  player.position.addScaledVector(move,speed*dt);
  playerYaw=Math.atan2(-move.x,-move.z);
  player.rotation.y=playerYaw;
 }

 // Стрибок
 if(keys.Space&&grounded){
  verticalSpeed=7;
  grounded=false;
 }

 verticalSpeed-=18*dt;
 player.position.y+=verticalSpeed*dt;

 if(player.position.y<=0){
  player.position.y=0;
  verticalSpeed=0;
  grounded=true;
 }

 player.position.x=THREE.MathUtils.clamp(player.position.x,-145,145);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-145,145);
}

// Керування автомобілем
function updateCar(dt){
 if(!currentCar)return;

 const car=currentCar;

 if(keys.KeyW)car.speed+=19*dt;
 if(keys.KeyS)car.speed-=23*dt;

 car.speed*=Math.pow(.985,dt*60);

 if(!keys.KeyW&&!keys.KeyS){
  car.speed*=Math.pow(.965,dt*60);
 }

 car.speed=THREE.MathUtils.clamp(car.speed,-18,38);

 const steer=(keys.KeyA?1:0)-(keys.KeyD?1:0);
 const steerPower=Math.min(Math.abs(car.speed)/8,1);

 car.yaw+=steer*steerPower*1.8*dt*
  (car.speed>=0?1:-1);

 car.group.rotation.y=car.yaw;

 const forward=new THREE.Vector3(
  -Math.sin(car.yaw),0,-Math.cos(car.yaw)
 );

 car.group.position.addScaledVector(
  forward,car.speed*dt
 );

 // Машина завжди стоїть колесами на землі
 car.group.position.y=0;

 for(const wheel of car.wheels){
  wheel.rotation.x+=car.speed*dt*2;
 }

 car.group.position.x=THREE.MathUtils.clamp(
  car.group.position.x,-148,148
 );
 car.group.position.z=THREE.MathUtils.clamp(
  car.group.position.z,-148,148
 );
}

// Рух міського трафіку
function updateTraffic(dt){
 for(const car of cars){
  if(!car.traffic)continue;

  const target=route[car.routeIndex];
  const dx=target.x-car.group.position.x;
  const dz=target.z-car.group.position.z;
  const distance=Math.sqrt(dx*dx+dz*dz);

  if(distance<5){
   car.routeIndex=(car.routeIndex+1)%route.length;
   continue;
  }

  const desiredYaw=Math.atan2(-dx,-dz);
  let diff=desiredYaw-car.yaw;

  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;

  car.yaw+=THREE.MathUtils.clamp(diff,-2*dt,2*dt);
  car.group.rotation.y=car.yaw;

  const forward=new THREE.Vector3(
   -Math.sin(car.yaw),0,-Math.cos(car.yaw)
  );

  car.group.position.addScaledVector(
   forward,car.speed*dt
  );
  car.group.position.y=0;
 }
}

// Рух пішоходів
function updatePeople(dt){
 for(const p of pedestrians){
  p.change-=dt;

  if(p.change<=0){
   p.direction+=(Math.random()-.5)*2.5;
   p.change=2+Math.random()*5;
  }

  p.group.position.x+=Math.sin(p.direction)*p.speed*dt;
  p.group.position.z+=Math.cos(p.direction)*p.speed*dt;
  p.group.rotation.y=p.direction;

  if(Math.abs(p.group.position.x)>145 ||
     Math.abs(p.group.position.z)>145){
   p.direction+=Math.PI;
  }

  const walk=Math.sin(performance.now()*.008)*.12;
  p.legs[0].rotation.x=walk;
  p.legs[1].rotation.x=-walk;
 }
}

// Камера
function updateCamera(dt){
 let target;
 let distance=9;
 let height=4;

 if(currentCar){
  target=currentCar.group.position.clone();
  distance=11;
  height=5;
 }else{
  target=player.position.clone();
  height=3;
 }

 const offset=new THREE.Vector3(
  Math.sin(cameraYaw)*distance,
  height+cameraPitch*5,
  Math.cos(cameraYaw)*distance
 );

 const desired=target.clone().add(offset);
 camera.position.lerp(desired,Math.min(1,dt*6));
 camera.lookAt(target.x,target.y+1.2,target.z);
}

// Підказка про двері
function updateHUD(){
 document.getElementById("status").textContent=
  inside?"У будинку":currentCar?"За кермом":"Пішохід";

 document.getElementById("speed").textContent=
  currentCar?Math.round(Math.abs(currentCar.speed)*3.6):0;

 document.getElementById("people").textContent=
  pedestrians.length;

 if(messageTimer>0){
  messageTimer-=clock.getDelta?0:0;
  if(messageTimer<=0){
   document.getElementById("message").style.display="none";
  }
 }
}

// Головний цикл
function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.033);

 updatePlayer(dt);
 updateCar(dt);
 updateTraffic(dt);
 updatePeople(dt);
 updateCamera(dt);

 if(messageTimer>0){
  messageTimer-=dt;
  if(messageTimer<=0){
   document.getElementById("message").style.display="none";
  }
 }

 renderer.render(scene,camera);
}

updateCamera(1);
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
